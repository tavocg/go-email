name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: |
            go.mod
            mailer/backends/mailgun/go.mod

      - name: Test root module
        run: go test -count=1 ./...

      - name: Vet root module
        run: go vet ./...

      - name: Test Mailgun backend module
        working-directory: mailer/backends/mailgun
        run: go test -count=1 ./...

      - name: Vet Mailgun backend module
        working-directory: mailer/backends/mailgun
        run: go vet ./...
